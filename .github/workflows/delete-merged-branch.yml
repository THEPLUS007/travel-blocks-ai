name: Delete merged PR branch

on:
  pull_request_target:
    types: [closed]

permissions: {}

jobs:
  delete-branch:
    if: >-
      github.event.pull_request.merged == true &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 2
    permissions:
      contents: write
    steps:
      # Never checkout or execute PR code in this privileged event.
      - name: Delete unchanged merged source branch
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json
          import os
          from urllib.error import HTTPError
          from urllib.parse import quote
          from urllib.request import Request, urlopen

          def main():
              with open(os.environ["GITHUB_EVENT_PATH"], encoding="utf-8") as source:
                  event = json.load(source)
              pr = event["pull_request"]
              repository = event["repository"]
              head = pr["head"]
              if not pr.get("merged") or not head.get("repo") or head["repo"]["full_name"] != repository["full_name"]:
                  print("Skipped: unmerged or fork PR.")
                  return
              branch = head["ref"]
              if branch in {"main", repository["default_branch"], pr["base"]["ref"]}:
                  print("Skipped: permanent or target branch.")
                  return
              repo_path = "/".join(quote(part, safe="") for part in repository["full_name"].split("/"))
              api = "https://api.github.com/repos/" + repo_path

              def request(method, path):
                  req = Request(api + path, method=method, headers={
                      "Authorization": "Bearer " + os.environ["GH_TOKEN"],
                      "Accept": "application/vnd.github+json",
                      "X-GitHub-Api-Version": "2022-11-28",
                  })
                  with urlopen(req, timeout=20) as response:
                      body = response.read()
                      return json.loads(body) if body else None

              try:
                  current = request("GET", "/branches/" + quote(branch, safe=""))
              except HTTPError as error:
                  if error.code != 404:
                      raise
                  print("Skipped: branch already absent.")
                  return
              if current["protected"] or current["commit"]["sha"] != head["sha"]:
                  print("Skipped: protected branch or branch advanced after merge.")
                  return
              request("DELETE", "/git/refs/heads/" + quote(branch, safe=""))
              print("Deleted merged PR source branch.")

          main()
