# HTTP bootstrap ONLY. Replace YOUR_DOMAIN before installation.
# Follow docs/DEPLOYMENT.md to issue the certificate and enable HTTPS.
server {
    listen 80;
    listen [::]:80;
    server_name YOUR_DOMAIN;
    root /var/www/travel-blocks-ai;
    index index.html;
    client_max_body_size 64k;
    client_body_timeout 30s;
    send_timeout 30s;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/letsencrypt;
        try_files $uri =404;
    }
    location = /api { return 308 /api/; }
    location ^~ /api/ {
        # No trailing URI: preserve /api/v1/... exactly.
        proxy_pass http://127.0.0.1:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        # Sole public edge: discard client-supplied forwarding chains.
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 120s;
        # Nginx owns HSTS after HTTPS validation; Helmet owns other API headers.
        proxy_hide_header Strict-Transport-Security;
    }
    location ^~ /assets/ {
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
    }
    location = /index.html {
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache" always;
        add_header X-Content-Type-Options nosniff always;
    }
}
